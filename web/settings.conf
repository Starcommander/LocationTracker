; Location Tracker Settings
; Configure your map boundaries and user credentials

[coordinates]
; Map boundaries (latitude and longitude)
lat_min=-90
lat_max=90
lon_min=-180
lon_max=180

[map]
; Map dimensions in pixels
width=2024
height=2024

[users]
; Add users in format: username=password
; Multiple users can be added, one per line
admin=changeme
demo=demo